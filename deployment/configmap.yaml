# Plaintext settings shared by the PostgreSQL and analytics (coworking) Deployments.
# The password lives in secret.yaml. ConfigMap values must be strings, so DB_PORT is quoted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coworking-configmap
data:
  DB_NAME: coworking
  DB_USERNAME: coworking_user
  # In-cluster DNS name of deployment/postgresql-service.yaml
  DB_HOST: postgresql-service
  DB_PORT: "5432"
