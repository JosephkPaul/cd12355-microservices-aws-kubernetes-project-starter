apiVersion: v1
kind: Service
metadata:
  name: coworking
spec:
  type: LoadBalancer
  selector:
    service: coworking
  ports:
  - name: http
    protocol: TCP
    port: 5153
    targetPort: 5153
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coworking
  labels:
    name: coworking
spec:
  replicas: 1
  # Start the new pod and wait for it to pass readiness before stopping the old one.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      service: coworking
  template:
    metadata:
      labels:
        service: coworking
      annotations:
        # Opt out of the OpenTelemetry agent the CloudWatch Observability add-on injects by default:
        # it takes over Python logging, hiding the request and report logs Container Insights collects.
        instrumentation.opentelemetry.io/inject-python: "false"
    spec:
      containers:
      - name: coworking
        # Image pushed by CodeBuild (buildspec.yaml): <account>.dkr.ecr.<region>.amazonaws.com/coworking:<semver>
        image: 389164333015.dkr.ecr.us-east-1.amazonaws.com/coworking:1.0.3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5153
        livenessProbe:
          httpGet:
            path: /health_check
            port: 5153
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: "/readiness_check"
            port: 5153
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        envFrom:
        - configMapRef:
            name: coworking-configmap
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: coworking-secret
              key: DB_PASSWORD
      restartPolicy: Always
